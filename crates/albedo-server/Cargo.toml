[package]
name              = "albedo-server"
version.workspace     = true
edition.workspace     = true
rust-version.workspace = true
authors.workspace     = true
license.workspace     = true
repository.workspace  = true
homepage.workspace    = true

[features]
# FORGE — the backend-less backend (development-plan/backend.md). ON BY
# DEFAULT so the stock `albedo` binary can serve a declared collection; this
# turns on the root crate's `forge` feature, which brings in the libSQL
# substrate (`dom_render_compiler::forge::LibSqlSubstrate`). Opt out with
# `--no-default-features`.
default = ["forge"]
forge = ["dom-render-compiler/forge"]

[dependencies]
async-trait.workspace          = true
async-stream.workspace         = true
axum.workspace                 = true
base64.workspace               = true
bytes.workspace                = true
dashmap.workspace              = true
dom-render-compiler.workspace  = true
futures-util.workspace         = true
http.workspace                 = true
matchit.workspace              = true
serde.workspace                = true
serde_json.workspace           = true
thiserror.workspace            = true
tokio.workspace                = true
tokio-stream.workspace         = true
tracing.workspace              = true
# The `albedo` binary is the only thing that *subscribes*; the library only
# emits. Without this the ~66 instrumentation sites in the tree have no receiver.
tracing-subscriber.workspace   = true
url.workspace                  = true
uuid.workspace                 = true
quinn.workspace                = true
rustls-pemfile.workspace       = true
rustls-pki-types.workspace     = true
tower-http.workspace           = true
xxhash-rust.workspace          = true

# Phase P · Stream A — the `albedo` CLI bin lives here (rather than in
# the root `dom-render-compiler` crate) so its `serve` subcommand can
# call `boot_production_server` without forming a workspace dep cycle.
# The source file remains at `<workspace>/src/bin/albedo.rs` and is
# reached via the relative `path` below; `include_str!` paths inside
# that file resolve from its on-disk location, not the crate root, so
# the existing `../../assets/...` / `../../scaffold/...` includes still
# work. The bin's extra deps (`notify`, `walkdir`) come in as ordinary
# dependencies above-level so they're available to the bin without
# polluting the `albedo_server` library's surface — the library uses
# none of them.
notify  = { workspace = true }
walkdir = { workspace = true }
ratatui = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
# APERTURE gate 5c only: the context-pool gate builds runtimes and contexts
# directly, because the question it settles is what the pool should be made OF.
# Nothing in the crate's own code links rquickjs — the engine stays behind
# `dom-render-compiler`'s seam.
rquickjs.workspace = true
tower.workspace = true
# AUTH P2 only: `tests/auth_password_http.rs` drives a *running* server rather
# than `Router::oneshot`, because the FORGE substrate — and therefore the
# `AuthRuntime` that resolves against it — is installed by `run_with_ready` and
# not by `build()`. A test that never binds a listener sees no auth at all, so
# it would prove the endpoints 404 and call that a pass.
reqwest.workspace = true

[[bin]]
name = "albedo"
path = "../../src/bin/albedo.rs"

# Opt this crate into `[workspace.lints]`. Without this table the workspace lint
# configuration is inert — declared and never applied — which is how
# `unsafe_code` sat "forbid" over a tree containing `unsafe`.
[lints]
workspace = true
